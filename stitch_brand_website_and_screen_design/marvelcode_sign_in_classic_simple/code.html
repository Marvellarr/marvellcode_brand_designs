<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="web_blank" name="shell-type"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Montserrat:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
    @layer base {
      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
    }
    ::-webkit-scrollbar { display: none; }
  </style>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-dim": "#0e1323",
            "on-tertiary": "#00354a",
            "on-tertiary-fixed-variant": "#004c69",
            "on-surface-variant": "#94a3b8",
            "error": "#ffb4ab",
            "secondary": "#d0bcff",
            "inverse-surface": "#dee1f9",
            "on-background": "#f8fafc",
            "outline": "#64748b",
            "tertiary": "#60a5fa",
            "surface-container-low": "#111827",
            "surface-container": "#172033",
            "on-primary": "#ffffff",
            "surface": "#0b1020",
            "on-primary-container": "#eeefff",
            "primary": "#3b82f6",
            "primary-container": "#2563eb",
            "surface-container-highest": "#1e293b",
            "background": "#0b1020",
            "surface-container-lowest": "#080d1d",
            "surface-container-high": "#1e293b",
            "outline-variant": "#334155",
            "on-surface": "#f1f5f9"
          },
          fontFamily: {
            "headline-lg": ["Montserrat", "sans-serif"],
            "headline-md": ["Montserrat", "sans-serif"],
            "headline-sm": ["Montserrat", "sans-serif"],
            "body-md": ["Inter", "sans-serif"],
            "body-sm": ["Inter", "sans-serif"],
            "label-lg": ["Inter", "sans-serif"],
            "label-md": ["Inter", "sans-serif"],
            "label-sm": ["Inter", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-[#0b1020] font-body-md text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white antialiased">
<!-- Minimal Header -->
<header class="w-full">
<div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
<a class="flex items-center gap-2.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded-lg p-1" data-path="home" href="#">
<div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-sm">
<span class="material-symbols-outlined text-[19px]">code</span>
</div>
<span class="font-headline-sm text-[17px] tracking-tight font-bold text-white">
          MARVEL<span class="text-blue-400">CODE</span>
</span>
</a>
<div class="flex items-center gap-6">
<a class="text-sm font-medium text-slate-400 hover:text-white transition-colors" data-path="help" href="#">Support</a>
<a class="text-sm font-medium text-slate-400 hover:text-white transition-colors flex items-center gap-2" data-path="status" href="#">
<span class="w-2 h-2 rounded-full bg-emerald-500"></span>
<span>Systems Normal</span>
</a>
</div>
</div>
</header>
<!-- Main Content Card -->
<main class="w-full flex-1 flex flex-col justify-center items-center px-4 py-8 sm:py-12">
<div class="w-full max-w-[440px]">
<!-- Clean, Classic Card -->
<div class="bg-[#131b2e] rounded-2xl border border-slate-800/80 shadow-2xl p-8 sm:p-10">
<!-- Brand & Heading -->
<div class="text-center mb-8">
<div class="w-12 h-12 rounded-xl bg-blue-600/10 border border-blue-500/20 text-blue-400 flex items-center justify-center mx-auto mb-4">
<span class="material-symbols-outlined text-[24px]">terminal</span>
</div>
<h1 class="font-headline-md text-2xl font-bold text-white tracking-tight mb-2">Welcome back</h1>
<p class="text-sm text-slate-400">Sign in to your MarvelCode account to continue</p>
</div>
<!-- Social Sign-in Buttons -->
<div class="grid grid-cols-2 gap-3 mb-6">
<button class="flex items-center justify-center gap-2.5 px-4 py-2.5 rounded-lg border border-slate-700 bg-slate-800/50 hover:bg-slate-800 text-slate-200 text-sm font-medium transition duration-150 active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-blue-500/40" type="button">
<svg aria-hidden="true" class="w-4 h-4 fill-current text-slate-200" viewbox="0 0 24 24">
<path clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill-rule="evenodd"></path>
</svg>
<span>GitHub</span>
</button>
<button class="flex items-center justify-center gap-2.5 px-4 py-2.5 rounded-lg border border-slate-700 bg-slate-800/50 hover:bg-slate-800 text-slate-200 text-sm font-medium transition duration-150 active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-blue-500/40" type="button">
<svg aria-hidden="true" class="w-4 h-4" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.27 21.39 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.26C.46 8.16 0 9.97 0 12s.46 3.84 1.26 5.42l4.02-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.27 2.61 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span>Google</span>
</button>
</div>
<!-- Divider -->
<div class="relative flex items-center justify-center mb-6">
<div class="w-full border-t border-slate-700/80"></div>
<span class="absolute bg-[#131b2e] px-3 text-xs text-slate-400">or continue with email</span>
</div>
<!-- Form -->
<form class="space-y-4" id="loginForm" onsubmit="event.preventDefault(); handleAuthSubmit();">
<!-- Work Email -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold uppercase tracking-wider text-slate-300" for="workEmail">Work Email</label>
<input class="w-full h-10 px-3.5 rounded-lg border border-slate-700 bg-slate-900/60 text-slate-100 text-sm placeholder:text-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" id="workEmail" placeholder="name@company.com" required="" type="email"/>
</div>
<!-- Password -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="block text-xs font-semibold uppercase tracking-wider text-slate-300" for="userPassword">Password</label>
</div>
<div class="relative flex items-center">
<input class="w-full h-10 pl-3.5 pr-10 rounded-lg border border-slate-700 bg-slate-900/60 text-slate-100 text-sm placeholder:text-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" id="userPassword" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-2.5 text-slate-400 hover:text-slate-200 transition-colors p-1 flex items-center justify-center focus:outline-none" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[18px]" id="passwordEyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember me & Forgot Password -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-blue-600 focus:ring-0 focus:ring-offset-0 cursor-pointer" id="rememberSession" type="checkbox"/>
<span class="text-sm text-slate-400">Remember me</span>
</label>
<a class="text-sm font-medium text-blue-400 hover:text-blue-300 transition-colors" href="#">Forgot password?</a>
</div>
<!-- Primary Submit Button -->
<button class="w-full h-10 mt-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm transition duration-150 flex items-center justify-center gap-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40" id="submitAuthBtn" type="submit">
<span id="btnText">Sign In</span>
</button>
</form>
<!-- Sign Up Link -->
<div class="mt-6 pt-5 border-t border-slate-800 text-center">
<p class="text-sm text-slate-400">
            Don't have an account?
            <a class="font-semibold text-blue-400 hover:text-blue-300 ml-1 transition-colors" href="#">Sign up</a>
</p>
</div>
</div>
</div>
</main>
<!-- Minimal Classic Footer -->
<footer class="w-full py-6 text-xs text-slate-500">
<div class="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
<span>© 2025 MarvelCode Inc. All rights reserved.</span>
<div class="flex items-center gap-6">
<a class="hover:text-slate-400 transition-colors" data-path="privacy-policy" href="#">Privacy Policy</a>
<a class="hover:text-slate-400 transition-colors" data-path="terms-of-service" href="#">Terms of Service</a>
<a class="hover:text-slate-400 transition-colors" data-path="security" href="#">Security</a>
</div>
</div>
</footer>
<script>
    function togglePasswordVisibility() {
      const input = document.getElementById('userPassword');
      const icon = document.getElementById('passwordEyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    function handleAuthSubmit() {
      const btn = document.getElementById('submitAuthBtn');
      const btnText = document.getElementById('btnText');
      
      btnText.textContent = 'Signing in...';
      btn.disabled = true;

      setTimeout(() => {
        btnText.textContent = 'Signed in';
        btn.classList.remove('bg-blue-600', 'hover:bg-blue-500');
        btn.classList.add('bg-emerald-600');
      }, 1000);
    }
  </script>
</body></html>
